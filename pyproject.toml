[project]
name = "csp-gps-issue-report"
version = "1.11.1"
description = "Turns CSP visit-failure complaints from WhatsApp into an Excel report and a dashboard (Eko India Financial Services, internal)."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pandas>=2.1,<3",
    "openpyxl>=3.1,<4",
    "Pillow>=10.0",
    "streamlit>=1.60,<2",
    "ImageHash>=4.3",
    "pytesseract>=0.3.10",
    "python-dateutil>=2.8",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["handover", "data", "output", "output_synthetic", "samples", "input"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]   # long regex and message lines are kept readable on one line

[tool.ruff.lint.per-file-ignores]
"process.py" = ["E402"]     # sys.path set before importing the package
"tests/*" = ["E402"]
